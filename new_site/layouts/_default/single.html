{{ define "main" }}

<main class="container">
  <article>

    <header>
      <h1>{{ .Title }}</h1>

      <p class="post-meta">
        {{ .Date.Format "Jan 2, 2006" }}
        {{ with .Params.author }}
          · {{ . }}
        {{ end }}
      </p>
    </header>

    <section class="post-content">
      {{ .Content }}
    </section>

  </article>
</main>

{{ end }}
